name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  deployments: read

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint application
      run: npm run lint

    - name: Typecheck application
      run: npm run typecheck

    - name: Run governed unit coverage
      run: npm run test:coverage

    - name: Set up Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Verify payment Edge Functions
      run: deno test --node-modules-dir=none --no-lock --allow-env supabase/functions/tests/payments_test.ts

    - name: Build application
      run: npm run build
      env:
        VITE_SUPABASE_URL: https://example.supabase.co
        VITE_SUPABASE_ANON_KEY: anon-key-placeholder

  promotion:
    name: Verify staged release
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      HEAD_BRANCH: ${{ github.head_ref }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify staging source and merge tree
        run: |
          if [[ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" || "$HEAD_BRANCH" != dev ]]; then
            echo "::error::Production PRs must come from this repository's dev branch."
            exit 1
          fi
          bash .github/scripts/check-staged-release.sh "$CANDIDATE_SHA"

  deploy:
    if: github.event_name == 'push'
    needs: quality
    uses: ./.github/workflows/supabase-migration.yml
