name: Supabase migration validation

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - "src/**"
      - "tests/acceptance/**"
      - "playwright.config.js"
      - ".github/workflows/supabase-validate.yml"
      - ".github/workflows/supabase-migration.yml"

jobs:
  validate:
    name: Reset, seed, and lint database
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start isolated Supabase runtime
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor

      - name: Rebuild database from migrations and seed
        run: supabase db reset

      - name: Lint database
        run: supabase db lint --local --level error

      - name: Test database abuse controls
        run: supabase test db

      - name: Export isolated runtime credentials
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          source "$RUNNER_TEMP/supabase.env"
          set +a
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Test atomic donation fulfillment and privileges
        run: node tests/integration/stripe-donations.mjs

      - name: Test abuse controls and concurrency
        run: node tests/integration/abuse-controls.mjs

      - name: Serve controlled program endpoint
        run: |
          echo 'ABUSE_LOCAL_DEVELOPMENT=true' > "$RUNNER_TEMP/abuse.env"
          supabase functions serve program-catalog --no-verify-jwt --env-file "$RUNNER_TEMP/abuse.env" > "$RUNNER_TEMP/catalog-runtime.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail -s "$VITE_SUPABASE_URL/functions/v1/program-catalog" -X POST -H 'Content-Type: application/json' -d '{"limit":1}' >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/catalog-runtime.log"
          exit 1

      - name: Run local browser acceptance
        run: npm run test:acceptance:local

      - name: Stop isolated Supabase runtime
        if: always()
        run: supabase stop --no-backup
